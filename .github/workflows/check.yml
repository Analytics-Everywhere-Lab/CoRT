name: Reproduction checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_release.py
      - run: python analysis/reproduce_all.py
      - run: python examples/position_replacement.py
      - run: python -m unittest discover -s tests -v
      - run: python -B runtime/cpu_checks.py
